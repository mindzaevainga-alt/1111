<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  .arjs-video { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; object-fit: cover !important; z-index: 0 !important; }
  a-scene, .a-canvas { position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; z-index: 1 !important; background: transparent !important; background-color: transparent !important; }
  .ar-video { position: absolute; width: 1px; height: 1px; left: -9999px; top: -9999px; opacity: 0.01; }
  #backBtn { position: fixed; top: 12px; left: 12px; z-index: 999999; padding: 10px 16px; border-radius: 20px; background: #000; color: #fff; border: 1px solid #4fc3f7; font-family: Arial, sans-serif; font-size: 14px; cursor: pointer; }
  #tapHint {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    z-index: 999999; padding: 12px 24px; border-radius: 25px;
    background: rgba(0,0,0,0.8); color: #4fc3f7;
    border: 2px solid #4fc3f7;
    font-family: Arial, sans-serif; font-size: 15px; font-weight: bold;
    text-align: center; pointer-events: none;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>
  <button id="backBtn">← Выйти</button>
  <div id="tapHint">👆 Коснитесь экрана, чтобы включить звук</div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; sourceWidth: 640; sourceHeight: 480; displayWidth: 640; displayHeight: 480;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true; premultipliedAlpha: false;"
    style="width:100%; height:100%; background: transparent;">

    <a-marker type="pattern" url="1-building.patt" id="m1">
      <a-video src="#v1" position="0 0 0" width="3" height="1.7" rotation="-90 0 0"></a-video>
    </a-marker>
    <a-marker type="pattern" url="2-bridge.patt" id="m2">
      <a-video src="#v2" position="0 0 0" width="3" height="1.7" rotation="-90 0 0"></a-video>
    </a-marker>
    <a-marker type="pattern" url="3-electric.patt" id="m3">
      <a-video src="#v3" position="0 0 0" width="3" height="1.7" rotation="-90 0 0"></a-video>
    </a-marker>
    <a-marker type="pattern" url="4-robot.patt" id="m4">
      <a-video src="#v4" position="0 0 0" width="3" height="1.7" rotation="-90 0 0"></a-video>
    </a-marker>
    <a-marker type="pattern" url="5-vehicles.patt" id="m5">
      <a-video src="#v5" position="0 0 0" width="3" height="1.7" rotation="-90 0 0"></a-video>
    </a-marker>
    <a-marker type="pattern" url="6-mine.patt" id="m6">
      <a-video src="#v6" position="0 0 0" width="3" height="1.7" rotation="-90 0 0"></a-video>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <video id="v1" class="ar-video" src="1-building.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
  <video id="v2" class="ar-video" src="2-bridge.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
  <video id="v3" class="ar-video" src="3-electric.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
  <video id="v4" class="ar-video" src="4-robot.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
  <video id="v5" class="ar-video" src="5-vehicles.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
  <video id="v6" class="ar-video" src="6-mine.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>

  <script>
    // Карта: id маркера → id видео
    var markerToVideo = {
      'm1': 'v1',
      'm2': 'v2',
      'm3': 'v3',
      'm4': 'v4',
      'm5': 'v5',
      'm6': 'v6'
    };

    // === ЕДИНСТВЕННОЕ АКТИВНОЕ ВИДЕО ===
    var currentVideoId = null;

    function stopVideo(videoId) {
      var v = document.getElementById(videoId);
      if (v) {
        try {
          v.pause();
          v.currentTime = 0;
        } catch(e) {}
      }
    }

    function stopAllExcept(exceptId) {
      for (var i = 1; i <= 6; i++) {
        var id = 'v' + i;
        if (id !== exceptId) stopVideo(id);
      }
    }

    // === ВЕШАЕМ СОБЫТИЯ НА КАЖДЫЙ МАРКЕР ===
    Object.keys(markerToVideo).forEach(function(markerId) {
      var marker = document.getElementById(markerId);
      var videoId = markerToVideo[markerId];
      if (!marker) return;

      marker.addEventListener('markerFound', function() {
        // Останавливаем все остальные видео
        stopAllExcept(videoId);
        
        // Запускаем нужное видео
        var v = document.getElementById(videoId);
        if (v) {
          v.currentTime = 0;
          v.play().catch(function(e){ console.log('play ' + videoId + ':', e); });
          currentVideoId = videoId;
        }
      });

      marker.addEventListener('markerLost', function() {
        // Останавливаем это видео, когда маркер ушёл
        stopVideo(videoId);
        if (currentVideoId === videoId) currentVideoId = null;
      });
    });

    // === КНОПКА ВЫЙТИ — стоп всё и уходим ===
    document.getElementById('backBtn').onclick = function() {
      stopAllExcept(null);
      setTimeout(function() {
        window.location.replace('index.html');
      }, 100);
    };

    // === ЗВУК ПО КАСАНИЮ ===
    var soundEnabled = false;
    function enableSound() {
      if (soundEnabled) return;
      soundEnabled = true;
      for (var i = 1; i <= 6; i++) {
        var v = document.getElementById('v' + i);
        if (v) { v.muted = false; v.volume = 1.0; }
      }
      var hint = document.getElementById('tapHint');
      if (hint) hint.style.display = 'none';
    }
    document.body.addEventListener('touchstart', enableSound, { once: true });
    document.body.addEventListener('click', enableSound, { once: true });

    // === РАСТЯГИВАЕМ ВИДЕОФОН КАМЕРЫ ===
    function fixARVideo() {
      document.querySelectorAll('video').forEach(function(v) {
        if (v.id && /^v\d$/.test(v.id)) return;
        v.style.position = 'fixed';
        v.style.top = '0';
        v.style.left = '0';
        v.style.width = '100vw';
        v.style.height = '100vh';
        v.style.objectFit = 'cover';
        v.style.zIndex = '0';
      });
      document.querySelectorAll('canvas').forEach(function(c) {
        c.style.position = 'fixed';
        c.style.top = '0';
        c.style.left = '0';
        c.style.width = '100vw';
        c.style.height = '100vh';
        c.style.zIndex = '1';
        c.style.background = 'transparent';
        c.style.backgroundColor = 'transparent';
      });
    }
    setTimeout(fixARVideo, 500);
    setTimeout(fixARVideo, 1500);
    setTimeout(fixARVideo, 3000);
    window.addEventListener('load', fixARVideo);
    window.addEventListener('resize', fixARVideo);

    // === При уходе со страницы — стоп всё ===
    window.addEventListener('pagehide', function() {
      stopAllExcept(null);
    });
  </script>
</body>
</html>
